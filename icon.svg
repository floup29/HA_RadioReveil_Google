<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1DB87A"/>
      <stop offset="100%" stop-color="#0A6E48"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="inner-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="118" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="128" cy="128" r="118" fill="url(#face)"/>

  <!-- Outer ring -->
  <circle cx="128" cy="128" r="116" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Clock body -->
  <circle cx="128" cy="140" r="68" fill="rgba(0,0,0,0.22)" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/>
  <circle cx="128" cy="140" r="62" fill="rgba(255,255,255,0.06)"/>

  <!-- Clock tick marks -->
  <g stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round">
    <!-- 12 -->
    <line x1="128" y1="82" x2="128" y2="91"/>
    <!-- 3 -->
    <line x1="184" y1="140" x2="175" y2="140"/>
    <!-- 6 -->
    <line x1="128" y1="196" x2="128" y2="187"/>
    <!-- 9 -->
    <line x1="72" y1="140" x2="81" y2="140"/>
  </g>
  <!-- Minor ticks -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round">
    <line x1="156" y1="84" x2="153" y2="92"/>
    <line x1="178" y1="106" x2="171" y2="109"/>
    <line x1="178" y1="172" x2="171" y2="169"/>
    <line x1="156" y1="194" x2="153" y2="186"/>
    <line x1="100" y1="194" x2="103" y2="186"/>
    <line x1="78" y1="172" x2="85" y2="169"/>
    <line x1="78" y1="106" x2="85" y2="109"/>
    <line x1="100" y1="84" x2="103" y2="92"/>
  </g>

  <!-- Hour hand -->
  <line x1="128" y1="140" x2="113" y2="116"
        stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="128" y1="140" x2="148" y2="105"
        stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="128" cy="140" r="5" fill="white"/>
  <circle cx="128" cy="140" r="2.5" fill="#1DB87A"/>

  <!-- Bell / alarm bumps -->
  <circle cx="93" cy="80" r="11" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <circle cx="163" cy="80" r="11" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <!-- Bell stem -->
  <rect x="121" y="68" width="14" height="6" rx="3" fill="rgba(255,255,255,0.5)"/>

  <!-- Radio waves (top arc) -->
  <g fill="none" stroke="white" stroke-linecap="round" opacity="0.9">
    <!-- 3 concentric arcs, left of center-top -->
    <path d="M 88 48 A 24 24 0 0 1 112 34" stroke-width="3.5" opacity="0.9"/>
    <path d="M 78 56 A 38 38 0 0 1 114 24" stroke-width="3" opacity="0.65"/>
    <path d="M 68 64 A 52 52 0 0 1 116 14" stroke-width="2.5" opacity="0.4"/>
    <!-- Right side -->
    <path d="M 168 48 A 24 24 0 0 0 144 34" stroke-width="3.5" opacity="0.9"/>
    <path d="M 178 56 A 38 38 0 0 0 142 24" stroke-width="3" opacity="0.65"/>
    <path d="M 188 64 A 52 52 0 0 0 140 14" stroke-width="2.5" opacity="0.4"/>
    <!-- Center dot -->
    <circle cx="128" cy="40" r="4" fill="white" stroke="none" opacity="0.95"/>
  </g>

  <!-- Bottom feet -->
  <ellipse cx="100" cy="212" rx="9" ry="5" fill="rgba(255,255,255,0.3)"/>
  <ellipse cx="156" cy="212" rx="9" ry="5" fill="rgba(255,255,255,0.3)"/>
</svg>